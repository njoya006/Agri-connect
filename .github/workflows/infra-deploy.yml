name: Infra Deploy (manual)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment (dev/prod)'
        required: true
        default: 'dev'

jobs:
  apply:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ inputs.AWS_REGION || 'us-west-2' }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: latest

      - name: Terraform Init
        working-directory: infra/terraform
        run: terraform init -input=false

      - name: Terraform Plan
        working-directory: infra/terraform
        run: terraform plan -input=false -var "key_name=${{ secrets.TF_VAR_key_name }}" -var "db_password=${{ secrets.TF_VAR_db_password }}" -var "docker_image=${{ secrets.TF_VAR_docker_image }}"

      - name: Terraform Apply
        if: github.event.inputs.environment == 'dev' || github.ref == 'refs/heads/main'
        working-directory: infra/terraform
        run: terraform apply -input=false -auto-approve -var "key_name=${{ secrets.TF_VAR_key_name }}" -var "db_password=${{ secrets.TF_VAR_db_password }}" -var "docker_image=${{ secrets.TF_VAR_docker_image }}"
